name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag release (để trống = chỉ build artifact, không tạo Release)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Keystore từ secrets; thiếu secret -> build.gradle.kts tự lùi về debug
      # signing (vẫn ra APK nhưng KHÔNG cài đè được các bản ký release).
      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            ls -l "$RUNNER_TEMP/release.jks"
            
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Thiếu secret KEYSTORE_B64 — APK sẽ ký bằng debug key"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-release.apk MuseTeam.apk
          sha256sum MuseTeam.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuseTeam-apk
          path: MuseTeam.apk

      - name: Create GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Đội Muse ${{ inputs.release_tag }}
          files: MuseTeam.apk
